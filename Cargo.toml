[package]
name = "mcpg-plugin-audit-s3-worm"
version = "0.1.0-alpha.18"
license = "BUSL-1.1"
edition = "2024"
description = "S3 Object-Lock (WORM) compliance audit_sink plugin for MCPG — immutable, retained audit events"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
metrics = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"

# Modern AWS HTTPS client (aws-lc-rs / rustls 0.23) — NOT the legacy
# `rustls` feature (which maps to hyper-0.14 + rustls 0.21). See the
# storage/s3 plugin for the same trap-avoidance note.
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
] }

[dev-dependencies]
# Docker-backed integration suite (LocalStack S3 with Object Lock).
# Gated behind `integration-tests` so the push-lane `--lib` run stays
# cheap + offline. The test creates an object-lock-enabled bucket and
# reads back the locked object, so it needs the S3 SDK + a runtime
# directly (integration tests don't inherit the lib's normal deps).
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["localstack", "blocking"] }

aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["cdylib-export"]
cdylib-export = []
# Declared so the SDK's audit_sink `build_static` accessor (gated
# `#[cfg(feature = "static-firstparty")]`) does not trigger
# `unexpected_cfgs` in consumer compilation. Empty: this plugin is
# consumed as a cdylib, not via the static-firstparty fast path.
static-firstparty = []
# Gates the LocalStack-backed integration suite. Run with `cargo test -p
# mcpg-plugin-audit-s3-worm --features integration-tests --test integration`.
integration-tests = []
